name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build '-Pversion=${{ github.run_number }}'

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireFlow
          path: ./build/libs/fireflow-*.jar

      - name: Generate Wiki
        id: build
        run: |
          wget -O fabric.jar https://meta.fabricmc.net/v2/versions/loader/26.2/0.19.3/1.1.2/server/jar
          mkdir mods
          wget -O mods/fabric-api.jar https://github.com/FabricMC/fabric-api/releases/download/0.157.0%2B26.2/fabric-api-0.157.0+26.2.jar
          cp build/libs/fireflow-${{ github.run_number }}.jar mods/
          echo "eula=true" > eula.txt
          FIREFLOW_GENERATE_WIKI=true java -jar fabric.jar

      - name: Upload Wiki Artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: wiki/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4